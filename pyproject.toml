[project]
name = "minivllm"
version = "0.0.1"
requires-python = ">=3.12"
# 依赖原则：这是一个自包含的教学项目。引擎本体只依赖 mlx（Metal 的算子库，相当于远程版的 torch + triton）。
# 分词用 tokenizers（HF 的 Rust 库，分词不是推理引擎要教的东西）；chat 模板、HTTP/SSE server 都自己写，不引入框架。
dependencies = ["mlx>=0.32", "tokenizers"]

[project.optional-dependencies]
# 开发/测试：HF 参考实现、下载、跑分客户端。永远不被 minivllm/ import；基线（mlx-lm、dflash-mlx）另放 .venv-mlx。
dev = ["torch", "transformers", "numpy", "pytest", "huggingface_hub", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
